<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML 範例</title>
</head>

<body>

    <!-- img 圖片 -->
    <img 
        src="https://images.unsplash.com/photo-1560463230-1d6803589edf?auto=format&fit=crop&w=600&q=80"
        alt="咖啡廳"
        width="300"
    >

    <!-- a 網頁連結 -->
    <a href="https://unsplash.com/" target="_blank">
        前往 Unsplash
    </a>

    <!-- button 按鈕 -->
    <button type="button">
        點我
    </button>

</body>
</html>
